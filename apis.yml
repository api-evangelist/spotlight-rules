aid: spotlight-rules
name: Spotlight Rules
description: >-
  Spotlight Rules is an openly-governed build of the Spectral API linter and, more importantly, the
  first attempt to publish the Spectral ruleset format as a standalone specification with its own
  portable JSON Schema — so that an organization's API governance rules stop being configuration for
  one vendor's CLI and become a durable, tool-independent artifact. Started in 2026 as a project of
  API Evangelist and maintained in the open under API Commons, it ships four public things: the
  specification and JSON Schema at spec.spotlight-rules.com, the reference implementation
  (api-commons/spotlight-tools), eight Apache-2.0 npm packages under the @spotlight-rules scope
  including the `spotlight` CLI, and a 332-rule best-of-breed governance ruleset compiled from public
  Spectral rulesets. It publishes no hosted API and no commercial tier — the stated position is open
  source permanently, funded by earmarked sponsorship rather than a paid version.
