notes:
  - The whole scope was published in one release wave on 2026-06-27 at 1.1.0; every
    package carries exactly two published versions (1.0.0 and 1.1.0). That single
    shared date is the currency signal for the entire distribution.
  - The npm README on @spotlight-rules/spotlight-cli is still the inherited upstream
    Spectral README — it links stoplight.io docs and shows `spectral lint` in the
    usage example, while the installed binary is `spotlight`. Observed 2026-09-04.
  - Source repositories for these packages are not public in the api-commons GitHub
    org (github.com/api-commons/spotlight-cli returns 404 unauthenticated); the
    packages themselves are public on npm.
