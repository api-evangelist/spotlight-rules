name: Spotlight Rules — published packages
description: >-
  First-party npm packages published by the Spotlight Rules project under the
  @spotlight-rules scope. These are the linting ENGINE and its ruleset/format
  libraries — the API Commons build of the Spectral linter — not client SDKs for
  a hosted API. Spotlight Rules publishes no callable HTTP API, so there is no
  API client library to record and no `SDKs` pointer is claimed.
